name: Deploy to Azure Web App

# Required repository settings:
#   secret   AZURE_WEBAPP_PUBLISH_PROFILE  (Web App > Overview > Get publish profile)
#   variable AZURE_WEBAPP_NAME             (the Web App name)
# App settings (COMPANY_NAME, POSTGRES_URL / MONGODB_URI, ADMIN_*, ...) live in the Azure portal, not here.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:standalone
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: dist
