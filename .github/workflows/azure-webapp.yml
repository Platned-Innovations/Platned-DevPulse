name: Deploy to Azure Web App

# Required repository settings:
#   secret   AZURE_WEBAPP_PUBLISH_PROFILE  (Web App > Overview > Get publish profile)
#   variable AZURE_WEBAPP_NAME             (the Web App name)
# Keep this the ONLY workflow that deploys to the Web App. A second one (for example the file Azure's
# Deployment Center generates, which zips the repository root and skips the .next folder) overwrites this
# bundle with the source tree, and the site then fails with "No production build found (.next)".
# App settings (COMPANY_NAME, POSTGRES_URL / MONGODB_URI, ADMIN_*, ...) live in the Azure portal, not here.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment settings
        env:
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if [ -z "$APP_NAME" ]; then
            echo "::error::Repository VARIABLE AZURE_WEBAPP_NAME is empty or missing (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          if [ -z "$PROFILE" ]; then
            echo "::error::Repository SECRET AZURE_WEBAPP_PUBLISH_PROFILE is empty or missing. It must be a repository secret (Secrets tab, not Variables), spelled exactly like this, in the repository that runs this workflow."
            exit 1
          fi
          case "$PROFILE" in
            *"<publishData>"*) ;;
            *) echo "::error::AZURE_WEBAPP_PUBLISH_PROFILE does not look like a publish profile. Paste the whole XML from Get publish profile, starting with <publishData>."; exit 1 ;;
          esac
          echo "Deployment settings found for app '$APP_NAME'."
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:standalone
      - name: Check the bundle is complete
        run: |
          ls -A dist
          test -f dist/start.cjs && test -f dist/server.js && test -d dist/.next/static && test -f dist/.deployment
          test -z "$(find dist -maxdepth 1 -name '.env*')"
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: dist
